<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d4a"/>
      <stop offset="100%" stop-color="#1e1e35"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow effect -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.3"/>
  <!-- Controller body -->
  <rect x="96" y="146" width="320" height="220" rx="42" fill="url(#bodyGrad)" stroke="url(#accent)" stroke-width="8"/>
  <!-- D-pad (left side) -->
  <rect x="140" y="186" width="32" height="88" rx="8" fill="url(#accent)"/>
  <rect x="116" y="212" width="88" height="32" rx="8" fill="url(#accent)"/>
  <!-- D-pad center -->
  <rect x="152" y="218" width="32" height="32" rx="4" fill="#6d28d9"/>
  <!-- Command buttons (right side) - 2x2 grid -->
  <circle cx="310" cy="210" r="18" fill="#8b5cf6"/>
  <circle cx="310" cy="260" r="18" fill="#7c3aed"/>
  <circle cx="360" cy="210" r="18" fill="#7c3aed"/>
  <circle cx="360" cy="260" r="18" fill="#6d28d9"/>
  <!-- Bottom indicator / speaker grille -->
  <rect x="192" y="320" width="128" height="10" rx="5" fill="url(#accent)"/>
  <rect x="200" y="340" width="112" height="4" rx="2" fill="#4a4a6a"/>
  <!-- Top indicator -->
  <rect x="220" y="166" width="72" height="6" rx="3" fill="#4a4a6a"/>
</svg>