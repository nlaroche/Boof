<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- Controller body -->
  <rect x="36" y="56" width="120" height="80" rx="16" fill="#252540" stroke="url(#accent)" stroke-width="4"/>
  <!-- D-pad (left side) -->
  <rect x="52" y="72" width="12" height="32" rx="3" fill="url(#accent)"/>
  <rect x="44" y="80" width="32" height="12" rx="3" fill="url(#accent)"/>
  <!-- Command buttons (right side) - 3 dots representing input -->
  <circle cx="118" cy="80" r="6" fill="#7c5bf5"/>
  <circle cx="132" cy="80" r="6" fill="#6d28d9"/>
  <circle cx="118" cy="96" r="6" fill="#6d28d9"/>
  <circle cx="132" cy="96" r="6" fill="#5b21b6"/>
  <!-- Bottom indicator line -->
  <rect x="72" y="118" width="48" height="4" rx="2" fill="url(#accent)"/>
</svg>