# =============================================================
# Aider Project-Level Configuration - Boof
# =============================================================
# React 19 + TypeScript + Vite PWA + Node.js Express 5 server
# =============================================================

# --- Conventions (read-only context, saves tokens vs prepending) ---
read: aider-conventions.md

# --- Test & Lint ---
test-cmd: powershell -ExecutionPolicy Bypass -File test.ps1 -Quick
lint-cmd: powershell -ExecutionPolicy Bypass -File lint.ps1
auto-test: true
auto-lint: true

# --- Git control ---
auto-commits: false
dirty-commits: true

# --- Repo Map ---
subtree-only: false
map-tokens: 512

# --- Autonomous mode optimizations ---
suggest-shell-commands: true
detect-urls: false
stream: false
pretty: false

# --- Caching ---
cache-prompts: true
